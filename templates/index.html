     通知・ヘッダーボタン用CSS
================================== -->

<style>

.home-header-buttons {

    position: absolute;

    right: 5px;
    top: 0;

    display: flex;

    align-items: center;

    gap: 10px;

}


.notification-button,
.settings-button {

    position: relative !important;

    right: auto !important;
    top: auto !important;

}


/* ==================================
   お知らせボタン
================================== */

.notification-button {

    width: 58px;
    height: 58px;

    padding: 0;

    border: none;

    background: transparent;

    cursor: pointer;

    position: relative;

}


.notification-button img {

    width: 72%;
    height: 72%;

    object-fit: contain;

    display: block;

    margin: auto;

}


/* ==================================
   未読件数バッジ
================================== */

.notification-badge {

    position: absolute;

    top: -3px;
    right: -3px;

    min-width: 25px;
    height: 25px;

    padding: 0 5px;

    border-radius: 999px;

    background: #ff1744;

    color: #ffffff;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 13px;

    font-weight: 900;

    line-height: 1;

    border: 2px solid #080909;

}


body.light-mode .notification-badge {

    border-color: #ffffff;

}


/* ==================================
   運行情報アイコン
================================== */

.operation-icon {

    width: 58px;
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    background: transparent !important;

    border: none !important;

    box-shadow: none !important;

}


.operation-icon img {

    width: 58px;
    height: 58px;

    object-fit: contain;

    display: block;

    background: transparent !important;

    border: none !important;

    box-shadow: none !important;

}


/* ==================================
   その他の路線追加部分
================================== */

.operation-info-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;

}


.operation-info-grid .operation-info {

    min-width: 0;

}


.operation-icon-image {

    width: 58px;
    height: 58px;

    object-fit: contain;

    display: block;

    background: transparent !important;

    border: none !important;

    box-shadow: none !important;

}


.other-operation-icon {

    width: 58px;
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    background: transparent !important;

    border: none !important;

    box-shadow: none !important;

}

    object-fit: contain;

    display: block;

    background: transparent !important;

    border: none !important;

    box-shadow: none !important;

    margin-left: auto;

    padding-left: 10px;

    font-size: 24px;

    color: inherit;

   その他の路線
================================== */

<script>


/* ==================================
   お知らせ
================================== */

const notificationReadKey =
    "ryomoNotificationReadIds";


/* ==================================
   既読お知らせID取得
================================== */

function getReadNotificationIds() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    notificationReadKey
                ) || "[]"
            );


        if (
            Array.isArray(data)
        ) {

            return data.map(
                String
            );

        }

    }

    catch (error) {

        console.error(
            "既読お知らせ情報の取得に失敗しました:",
            error
        );

    }


    return [];

}


/* ==================================
   既読お知らせID保存
================================== */

function setReadNotificationIds(
    ids
) {

    try {

        localStorage.setItem(

            notificationReadKey,

            JSON.stringify(
                [
                    ...new Set(
                        ids.map(String)
                    )
                ]
            )

        );

    }

    catch (error) {

        console.error(
            "既読お知らせ情報の保存に失敗しました:",
            error
        );

    }

}


/* ==================================
   未読件数表示用数字
================================== */

function getNotificationCountText(
    number
) {

    if (
        number >= 10
    ) {

        return "9＋";

    }


    return String(number);

}


/* ==================================
   お知らせ未読件数更新
================================== */

async function updateNotificationBadge() {

    const badge =
        document.getElementById(
            "notification-badge"
        );


    if (!badge) {

        return;

    }


    try {

        const response =
            await fetch(

                "/api/notifications?"
                +
                Date.now(),

                {
                    cache: "no-store"
                }

            );


        if (
            !response.ok
        ) {

            throw new Error(
                "お知らせ取得失敗"
            );

        }


        const data =
            await response.json();


        const notifications =
            Array.isArray(data)

                ? data

                : (
                    Array.isArray(
                        data.notifications
                    )

                        ? data.notifications

                        : []
                );


        const readIds =
            getReadNotificationIds();


        const unreadCount =
            notifications.filter(

                function(item) {

                    if (
                        !item
                        ||
                        typeof item !== "object"
                    ) {

                        return false;

                    }


                    return !readIds.includes(
                        String(item.id)
                    );

                }

            ).length;


        if (
            unreadCount > 0
        ) {

            badge.textContent =
                getNotificationCountText(
                    unreadCount
                );

            badge.hidden = false;

            badge.style.display = "flex";

        }

        else {

            badge.textContent = "";

            badge.hidden = true;

            badge.style.display = "none";

        }

    }


    catch (error) {

        console.error(
            "お知らせ取得エラー:",
            error
        );


        badge.textContent = "";

        badge.hidden = true;

        badge.style.display = "none";

    }

}


/* ==================================
   お知らせページを開く
================================== */

function openNotifications() {

    window.location.href =
        "/notifications";

}


/* ==================================
   お知らせ未読件数確認
================================== */

updateNotificationBadge();


/* ==================================
   30秒ごとに新しいお知らせを確認
================================== */

setInterval(

    updateNotificationBadge,

    30000

);


/* ==================================
   既読状態変更を監視
================================== */

window.addEventListener(

    "storage",

    function(event) {

        if (
            event.key ===
            notificationReadKey
        ) {

            updateNotificationBadge();

        }

    }

);


/*
 * お知らせ画面からホームに戻った場合
 */

window.addEventListener(

    "pageshow",

    function() {

        updateNotificationBadge();

    }

);


/*
 * タブを再び表示した場合
 */

document.addEventListener(

    "visibilitychange",

    function() {

        if (
            document.visibilityState ===
            "visible"
        ) {

            updateNotificationBadge();

        }

    }

);


/*
 * ブラウザの別画面から
 * ホームに戻った場合にも再確認
 */

window.addEventListener(

    "focus",

    function() {

        updateNotificationBadge();

    }

);


/* ==================================
   ホーム初期化
================================== */

function initializeHome() {


    applySavedDisplayMode();


    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const forceHome =
        urlParams.get("home") === "1";


    if (forceHome) {

        window.history.replaceState(
            null,
            "",
            "/"
        );

    }


    updateClock();


    setInterval(
        updateClock,
        1000
    );


    loadOperationInfo();


    setInterval(
        loadOperationInfo,
        60000
    );


    if (forceHome) {

        return;

    }


    const defaultStation =
        localStorage.getItem(
            "defaultStation"
        ) || "none";


    if (
        defaultStation === "none"
    ) {

        return;

    }


    const stationIds = [

        "oyama",

        "omoigawa",

        "tochigi",

        "ohirashita",

        "iwafune",

        "sano",

        "tomita",

        "ashikaga_flower_park",

        "ashikaga",

        "yamamae",

        "omata"

    ];


    if (
        stationIds.includes(
            defaultStation
        )
    ) {

        openStationPage(
            defaultStation
        );

        return;

    }


    if (
        defaultStation === "nearest"
    ) {

        findNearestStation(
            true
        );

        return;

    }

}


/* ==================================
   時刻表の形式を取得
================================== */

function getTimetableFormat() {

    return (

        localStorage.getItem(
            "timetableFormat"
        ) || "board"

    );

}


/* ==================================
   駅ページを開く
================================== */

function openStationPage(
    stationId
) {

    const timetableFormat =
        getTimetableFormat();


    if (
        timetableFormat === "list"
    ) {

        window.location.href =
            "/station/"
            +
            stationId
            +
            "/timetable";

        return;

    }


    window.location.href =
        "/station/"
        +
        stationId;

}


/* ==================================
   駅カードクリック
================================== */

function openStation(
    event,
    stationId
) {

    event.preventDefault();


    openStationPage(
        stationId
    );

}


/* ==================================
   表示モード
================================== */

function applySavedDisplayMode() {

    const displayMode =
        localStorage.getItem(
            "displayMode"
        ) || "system";


    let useLightMode =
        false;


    if (
        displayMode === "light"
    ) {

        useLightMode =
            true;

    }

    else if (
        displayMode === "system"
    ) {

        useLightMode =
            !window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

    }


    document.body.classList.toggle(
        "light-mode",
        useLightMode
    );

}


/* ==================================
   端末テーマ変更監視
================================== */

const systemThemeQuery =
    window.matchMedia(
        "(prefers-color-scheme: dark)"
    );


function handleSystemThemeChange() {

    const currentMode =
        localStorage.getItem(
            "displayMode"
        ) || "system";


    if (
        currentMode === "system"
    ) {

        applySavedDisplayMode();

    }

}


if (
    systemThemeQuery.addEventListener
) {

    systemThemeQuery.addEventListener(
        "change",
        handleSystemThemeChange
    );

}

else {

    systemThemeQuery.addListener(
        handleSystemThemeChange
    );

}

   駅情報
================================== */

    },

    },

        lat: 36.323583,

    },


    {

        lat: 36.316633,

    },


    {

        lat: 36.3162158,

    },


    {

    },


    {

    {

    {

/* ==================================
   時計
================================== */

function updateClock() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    const hours =
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    const seconds =
        String(
            now.getSeconds()
        ).padStart(
            2,
            "0"
        );


    const weekdays = [

        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"

    ];


    const weekday =
        weekdays[
            now.getDay()
        ];


    document.getElementById(
        "current-date"
    ).textContent =
        `${year}/${month}/${day}(${weekday})`;


    document.getElementById(
        "current-time"
    ).textContent =
        `${hours}:${minutes}:${seconds}`;

}


/* ==================================
   運行情報
================================== */

async function loadOperationInfo() {

    const operationBox =
        document.getElementById(
            "operation-info"
        );


    const operationIconImage =
        document.getElementById(
            "operation-icon-image"
        );


    const operationStatus =
        document.getElementById(
            "operation-status"
        );


    const operationText =
        document.getElementById(
            "operation-text"
        );


    const operationUpdated =
        document.getElementById(
            "operation-updated"
        );


    try {

        const response =
            await fetch(
                "/api/operation",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "運行情報の取得に失敗しました"
            );

        }


        const data =
            await response.json();


        operationBox.className =
            "operation-info";


        if (
            data.status === "平常運転"
        ) {

            operationBox.classList.add(
                "normal"
            );


            operationIconImage.src =
                "{{ url_for('static', filename='icons/operation-normal.png') }}";


            operationIconImage.alt =
                "平常運転";


            operationStatus.textContent =
                "平常運転";


            operationText.textContent =
                data.message ||
                "両毛線は平常通り運転しています。";

        }


        else if (
            data.status === "遅延"
        ) {

            operationBox.classList.add(
                "delay"
            );


            operationIconImage.src =
                "{{ url_for('static', filename='icons/operation-delay.png') }}";


            operationIconImage.alt =
                "遅延";


            operationStatus.textContent =
                "遅延";


            operationText.textContent =
                data.message ||
                "両毛線は、一部列車に遅れが出ています。";

        }


        else if (

            data.status === "運転見合わせ"

            ||

            data.status === "運休"

        ) {

            operationBox.classList.add(
                "suspended"
            );


            operationIconImage.src =
                "{{ url_for('static', filename='icons/operation-suspended.png') }}";


            operationIconImage.alt =
                data.status;


            operationStatus.textContent =
                data.status;


            operationText.textContent =
                data.message ||
                "両毛線は、運転を見合わせています。";

        }


        else {

            operationBox.classList.add(
                "unknown"
            );


            operationIconImage.src =
                "{{ url_for('static', filename='icons/operation-info.png') }}";


            operationIconImage.alt =
                "情報取得中";


            operationStatus.textContent =
                data.status ||
                "情報取得中";


            operationText.textContent =
                data.message ||
                "現在、運行情報を取得しています。";

        }


        if (
            data.updated
        ) {

            operationUpdated.textContent =
                "更新：" +
                String(
                    data.updated
                ).replace(
                    /\s*更新\s*$/,
                    ""
                );

        }

        else {

            operationUpdated.textContent =
                "";

        }

    }


    catch (error) {

        console.error(
            "運行情報取得エラー:",
            error
        );


        operationBox.className =
            "operation-info unknown";


        operationIconImage.src =
            "{{ url_for('static', filename='icons/operation-info.png') }}";


        operationIconImage.alt =
            "情報取得中";


        operationStatus.textContent =
            "情報取得中";


        operationText.textContent =
            "現在、運行情報を取得できません。";


        operationUpdated.textContent =
            "";

    }

}

/* ==================================
   現在地
================================== */

function findNearestStation(
    isDefaultStation = false
) {

    if (
        !navigator.geolocation
    ) {

        if (!isDefaultStation) {

            alert(
                "このブラウザでは現在地を取得できません。"
            );

        }

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const userLat =
                position.coords.latitude;


            const userLon =
                position.coords.longitude;


            let nearestStation =
                null;


            let nearestDistance =
                Infinity;


            stations.forEach(
                function(station) {

                    const distance =
                        calculateDistance(

                            userLat,
                            userLon,

                            station.lat,
                            station.lon

                        );


                    if (
                        distance <
                        nearestDistance
                    ) {

                        nearestDistance =
                            distance;


                        nearestStation =
                            station;

                    }

                }
            );


            if (
                nearestStation
            ) {

                openStationPage(
                    nearestStation.id
                );

            }

        },


        function(error) {

            console.error(
                "現在地取得エラー:",
                error
            );


            if (
                !isDefaultStation
            ) {

                if (
                    error.code === 1
                ) {

                    alert(
                        "現在地の取得が許可されていません。"
                    );

                }

                else {

                    alert(
                        "現在地を取得できませんでした。"
                    );

                }

            }

        },


        {

            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 60000

        }

    );

}


/* ==================================
   距離計算
================================== */

function calculateDistance(

    lat1,
    lon1,

    lat2,
    lon2

) {

    const R =
        6371;


    const dLat =
        (lat2 - lat1)
        * Math.PI
        / 180;


    const dLon =
        (lon2 - lon1)
        * Math.PI
        / 180;


    const a =

        Math.sin(
            dLat / 2
        )
        *
        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            lat1 * Math.PI / 180
        )

        *

        Math.cos(
            lat2 * Math.PI / 180
        )

        *

        Math.sin(
            dLon / 2
        )
        *
        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(
                1 - a
            )

        );


    return R * c;

}
