/* ==================================================
   保存されている表示モードを適用
================================================== */

function applyDisplayMode() {

    const displayMode =
        localStorage.getItem("displayMode")
        ||
        "system";

    let useLightMode = false;

    if (displayMode === "dark") {

        useLightMode = false;

    }

    else if (displayMode === "light") {

        useLightMode = true;

    }

    else if (displayMode === "system") {

        useLightMode =
            !window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

    }

    document.body.classList.toggle(
        "light-mode",
        useLightMode
    );

}

applyDisplayMode();


/* ==================================================
   端末のダーク・ライト設定変更
================================================== */

function handleSystemThemeChange() {

    const displayMode =
        localStorage.getItem("displayMode")
        ||
        "system";

    if (displayMode === "system") {

        applyDisplayMode();

    }

}

if (systemThemeQuery.addEventListener) {

    systemThemeQuery.addEventListener(

}

function setSinglePlatformInfo(

    config
) {

    const block =
        document.getElementById(
            `platform${platformIndex}-block`
        );

    if (!config) {

        block.style.display = "none";

        return;

    }

    block.style.display = "";

    const numberElement =
        document.getElementById(
            `platform${platformIndex}-number`
        );

    numberElement.textContent =
        config.number;

    if (!config.number) {

        numberElement.style.display =
            "none";

        block.classList.add(
            "no-platform-number"
        );

    }

    else {

        numberElement.style.display =
            "";

        block.classList.remove(
            "no-platform-number"
        );

    }

    if (
        config.number
        &&
        config.number.includes("･")
    ) {

        block.classList.add(
            "multiple-platform-number"
        );

    }

    else {

        block.classList.remove(
            "multiple-platform-number"
        );

        `platform${platformIndex}-direction`
    ).textContent =
        config.name;

    document.getElementById(
        `platform${platformIndex}-direction-en`
    ).textContent =
        config.english;

/* ==================================================
   列車データ整理
================================================== */

function normalizeTrain(train) {

    const result = {
        ...train
    };

    if (
        result.direction === "下り"
        &&
        result.train_number === "普通"
        &&
        typeof result.cars === "string"
        &&
        /^\d+M$/.test(
            result.cars.trim()
        )
    ) {

        const correctTrainNumber =
            result.cars.trim();

        result.train_number =
            correctTrainNumber;

        result.type =
            "普通";

        result.cars =
            downCars[
                correctTrainNumber
            ]
            ||
            null;

    }

    if (
        typeof result.cars === "string"
        &&
        /^\d+M$/.test(
            result.cars.trim()
        )
    ) {

        const number =
            result.cars.trim();

        if (
            result.train_number === number
        ) {

            result.cars =
                downCars[number]
                ||
                null;

        }

    }

    if (!result.type) {

        result.type =
            "普通";

    }

    return result;

}

/* ==================================================
   時刻 → 秒
================================================== */

function timeToSeconds(time) {

    if (!time) {
        return null;
    }

    const parts =
        time.split(":");

    if (parts.length !== 2) {
        return null;
    }

    const hour =
        Number(parts[0]);

    const minute =
        Number(parts[1]);

    if (
        !Number.isFinite(hour)
        ||
        !Number.isFinite(minute)
    ) {
        return null;
    }

    return (
        hour * 60 * 60
        +
        minute * 60
    );

}

    const stops =
        train.stops || {};

    const stationKey =
        stationName.replace(
            /駅$/,
            ""

    const station =
        stops[stationKey];

    if (!station) {
        return null;
    }

    return (
        station.departure
        ||
        station.arrival
        ||
        null
    );

}

        train.stops || {};

    const stationKey =
        stationName.replace(
            /駅$/,
            ""
        );

    const station =
        stops[stationKey];

    if (!station) {
        return null;
    }

    return (
        station.arrival
        ||
        station.departure
        ||
        null
    );

}


/* ==================================================
   時刻文字列 → Date
================================================== */

function timeToDate(
    time,
    baseDate = new Date()
) {

    if (!time) {
        return null;
    }

    const parts =
        time.split(":");

    if (parts.length !== 2) {
        return null;
    }

    let hour =
        Number(parts[0]);

    const minute =
        Number(parts[1]);

    if (
        !Number.isFinite(hour)
        ||
        !Number.isFinite(minute)
        ||
        minute < 0
        ||
        minute > 59
    ) {
        return null;
    }

    const date =
        new Date(baseDate);

    if (hour >= 24) {

        hour -= 24;

        date.setDate(
            date.getDate() + 1
        );

    }

    date.setHours(
        hour,
        minute,
        0,
        0
    );

    return date;

}


/* ==================================================
   両数取得
================================================== */

function getCars(train) {

    let cars =
        train.cars;

    if (
        typeof cars === "string"
    ) {

        cars =
            cars.trim();

        if (
            /^\d+M$/.test(cars)
        ) {

            const trainNumber =
                String(
                    train.train_number || ""
                ).trim();

            if (
                downCars[trainNumber]
            ) {

                return downCars[
                    trainNumber
                ];

            }

            return null;

        }

    }

    const number =
        Number(cars);

    if (
        Number.isFinite(number)
        &&
        number > 0
    ) {

        return number;

    }

    return null;

}


/* ==================================================
   到着まで
================================================== */

function getArrivalStatus(
    arrival,
    departure
) {

    if (!arrival) {

        return {
            number: "",
            label: "",
            status: "normal"
        };

    }

    const now =
        new Date();

    const arrivalDate =
        timeToDate(
            arrival,
            now
        );

    const departureDate =
        timeToDate(
            departure || arrival,
            now
        );

    if (!arrivalDate) {

        return {
            number: "",
            label: "",
            status: "normal"
        };

    }

    if (
        now < arrivalDate
    ) {

        const diffSeconds =
            Math.max(
                0,
                Math.floor(
                    (
                        arrivalDate
                        -
                        now
                    ) / 1000
                )
            );

        const remainingMinutes =
            Math.ceil(
                diffSeconds / 60
            );

        return {

            number:
                remainingMinutes,

            label:
                "分",

            status:
                "normal"

        };

    }

    if (
        departureDate
        &&
        now < departureDate
    ) {

        return {

            number:
                "停車中",

            label:
                "",

            status:
                "stopped"

        };

    }

    return {

        number:
            "発車済",

        label:
            "",

        status:
            "departed"

    };

}


/* ==================================================
   表示対象か
================================================== */

function isTrainStillDisplayed(train) {

    const departure =
        getStationDeparture(train);

    if (!departure) {
        return false;
    }

    const now =
        new Date();

    const departureDate =
        timeToDate(
            departure,
            now
        );

    if (!departureDate) {
        return false;
    }

    const removeTime =
        new Date(
            departureDate.getTime()
            +
            60 * 1000
        );

    return (
        now < removeTime
    );

}


/* ==================================================
   列車HTML
================================================== */

function createTrainHTML(train) {

    const type =
        train.type || "普通";

    const typeEnglish =
        getTypeEnglish(type);

    const destination =
        train.destination || "";

    const destinationEnglish =
        getDestinationEnglish(
            destination
        );

    const arrival =
        getStationArrival(train);

    const departure =
        getStationDeparture(train);

    const cars =
        getCars(train);

    const remaining =
        getArrivalStatus(
            arrival,
            departure
        );

    if (
        !isTrainStillDisplayed(train)
    ) {
        return "";
    }

    let carsClass =
        "cars-green";

    if (
        cars !== null
        &&
        cars >= 6
    ) {

        carsClass =
            "cars-orange";

    }

    let carsHTML =
        "";

    if (cars !== null) {

        carsHTML = `

            <div
                class="car-badge ${carsClass}"
            >

                <strong>
                    ${cars}
                </strong>

                <span>
                    両
                </span>

            </div>

        `;

    }

    let remainingHTML = `

        <div
            class="remaining ${remaining.status}"
        >

            <strong>
                ${remaining.number}
            </strong>

            <span>
                ${remaining.label}
            </span>

        </div>

    `;

    const note =
        train.note || "";

    const abnormalOperation =

        operationInfo.status
            !== "平常運転"

        &&

        operationInfo.status
            !== "情報取得中"

        &&

        operationInfo.message;

    const isMobile =
        window.innerWidth <= 800;

    let noteHTML =
        "";

    if (
        note
        ||
        abnormalOperation
    ) {

        const noteText =
            isMobile
                ? note
                : `　　${note}`;

        noteHTML = `

            <div class="note">

                ${note
                    ? noteText
                    : ""
                }

                ${
                    abnormalOperation
                    ?
                    `

                        <span
                            style="
                                color: red;
                                font-weight: bold;
                                margin-left: 8px;
                            "
                        >
                            【運行情報】${operationInfo.message}
                        </span>

                    `
                    :
                    ""
                }

            </div>

        `;

    }

    else {

        noteHTML = `

            <div
                class="empty-note"
            ></div>

        `;

    }

    return `

        <div
            class="train-row"
            onclick="openTrainDetails(
                '${encodeURIComponent(
                    train.train_number || ""
                )}'
            )"
            style="cursor: pointer;"
        >

            <div>

                <div class="local-box">

                    <strong>
                        ${type}
                    </strong>

                    <span>
                        ${typeEnglish}
                    </span>

                </div>

            </div>


            <div>

                <div
                    class="departure-time"
                >
                    ${departure || ""}
                </div>

            </div>


            <div>

                <div
                    class="destination"
                    style="
                        display:flex;
                        flex-direction:column;
                        align-items:center;
                        justify-content:center;
                        line-height:1;
                        gap:0;
                    "
                >

                    <strong
                        style="
                            display:block;
                            line-height:1.05;
                        "
                    >
                        ${destination}
                    </strong>

                    <span
                        style="
                            display:block;
                            line-height:1;
                            margin-top:0;
                        "
                    >
                        ${destinationEnglish}
                    </span>

                </div>

            </div>


            <div class="cars">

                ${carsHTML}

            </div>


            <div>

                ${remainingHTML}

            </div>

        </div>


        ${noteHTML}

    `;

}


/* ==================================================
   次の列車2本
================================================== */

function getTodayUpcomingTrains(
    direction
) {

    const now =
        new Date();

    if (
        now.getHours() < 4
    ) {

        return [];

    }

    let trains =

        allTrains

            .filter(
                train =>
                    train.direction
                    ===
                    direction
            )

            .filter(
                train =>
                    isTrainStillDisplayed(
                        train
                    )
            );

    trains.sort(
        (a, b) => {

            const aTime =
                timeToDate(
                    getStationDeparture(a),
                    now
                );

            const bTime =
                timeToDate(
                    getStationDeparture(b),
                    now
                );

            if (!aTime) {
                return 1;
            }

            if (!bTime) {
                return -1;
            }

            return (
                aTime - bTime
            );

        }
    );

    return trains.slice(
        0,
        2
    );

}


/* ==================================================
   本日の列車終了
================================================== */

function showServiceFinished(
    container
) {

    container.innerHTML = `

        <div
            class="service-finished"
        >

            本日の列車は終了しました。

        </div>

    `;

}


/* ==================================================
   番線表示
================================================== */

function renderPlatform(
    containerId,
    headerId,
    direction
) {

    const container =
        document.getElementById(
            containerId
        );

    const header =
        document.getElementById(
            headerId
        );

    if (!direction) {

        header.style.display =
            "none";

        container.innerHTML =
            "";

        return;

    }

    const trains =
        getTodayUpcomingTrains(
            direction
        );

    if (
        trains.length === 0
    ) {

        header.style.display =
            "none";

        showServiceFinished(
            container
        );

    }

    else {

        header.style.display =
            "grid";

        container.innerHTML =
            trains
                .map(
                    createTrainHTML
                )
                .join("");

    }

}


/* ==================================================
   列車表示
================================================== */

function renderTrains() {

    if (
        !currentStationConfig
    ) {

        return;

    }

    if (
        currentStationConfig.platform1
    ) {

        renderPlatform(

            "platform1-trains",

            "platform1-header",

            currentStationConfig
                .platform1
                .direction

        );

    }

    else {

        document.getElementById(
            "platform1-header"
        ).style.display =
            "none";

        document.getElementById(
            "platform1-trains"
        ).innerHTML =
            "";

    }

    if (
        currentStationConfig.platform2
    ) {

        renderPlatform(

            "platform2-trains",

            "platform2-header",

            currentStationConfig
                .platform2
                .direction

        );

    }

    else {

        document.getElementById(
            "platform2-header"
        ).style.display =
            "none";

        document.getElementById(
            "platform2-trains"
        ).innerHTML =
            "";

    }

}


/* ==================================================
   運行情報取得
================================================== */

async function loadOperationInfo() {

    try {

        const response =
            await fetch(
                "/api/operation?"
                +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "運行情報の取得に失敗しました"
            );

        }

        const data =
            await response.json();

        operationInfo = {

            status:
                data.status
                ||
                "情報取得中",

            message:
                data.message
                ||
                ""

        };

        renderTrains();

    }

    catch (error) {

        console.error(
            "運行情報取得エラー:",
            error
        );

    }

}


/* ==================================================
   timetable.json取得
================================================== */

async function loadTimetable() {

    try {

        const response =
            await fetch(
                "/api/timetable?"
                +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "データ取得に失敗しました"
            );

        }

        const data =
            await response.json();

        allTrains =
            (data.trains || [])
                .map(
                    normalizeTrain
                );

        renderTrains();

    }

    catch (error) {

        console.error(
            error
        );

        document.getElementById(
            "platform1-header"
        ).style.display =
            "none";

        document.getElementById(
            "platform2-header"
        ).style.display =
            "none";

        document.getElementById(
            "platform1-trains"
        ).innerHTML = `

            <div
                class="service-finished"
            >

                データを取得できません

            </div>

        `;

        document.getElementById(
            "platform2-trains"
        ).innerHTML = `

            <div
                class="service-finished"
            >

                データを取得できません

            </div>

        `;

    }

}


/* ==================================================
   時計
================================================== */

function updateClock() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );

    const day =
        String(
            now.getDate()
        )
        .padStart(
            2,
            "0"
        );

    const weekday =
        [
            "日",
            "月",
            "火",
            "水",
            "木",
            "金",
            "土"
        ][
            now.getDay()
        ];

    const hours =
        String(
            now.getHours()
        )
        .padStart(
            2,
            "0"
        );

    const minutes =
        String(
            now.getMinutes()
        )
        .padStart(
            2,
            "0"
        );

    const seconds =
        String(
            now.getSeconds()
        )
        .padStart(
            2,
            "0"
        );

    document.getElementById(
        "current-date"
    ).textContent =
        `${year}/${month}/${day}(${weekday})`;

    document.getElementById(
        "current-time"
    ).textContent =
        `${hours}:${minutes}:${seconds}`;

}


/* ==================================================
   ホームへ戻る
================================================== */

function goHome(event) {

    event.preventDefault();

    window.location.href =
        "/?home=1";

}


/* ==================================================

================================================== */

function openTrainDetails(
    trainNumber
) {

    if (!trainNumber) {
        return;
    }

    window.location.href =
        "/train/"
        +
        trainNumber;

}
